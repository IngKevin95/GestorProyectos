version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: backend/Dockerfile.postgres
    container_name: gestor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gestor_proyectos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestor}"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gestor-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gestor-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gestor}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-gestor_proyectos}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gestor-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gestor-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gestor-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  gestor-network:
    driver: bridge
